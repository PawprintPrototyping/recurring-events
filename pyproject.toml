[project]
name = "mobilizon-recurring-events"
version = "0.1.0"
description = "Create recurring Mobilizon events from YAML"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "requests>=2.32.3,<3",
  "PyYAML>=6.0.2,<7",
  "python-dateutil>=2.9.0.post0,<3",
]

[tool.uv]
package = false

[tool.isort]
known_third_party = ["dateutil", "requests", "yaml"]
