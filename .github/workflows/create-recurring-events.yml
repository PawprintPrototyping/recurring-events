name: 🔁 Create recurring Mobilizon events

on:
  #schedule:
  #  - cron: "12 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]


permissions:
  contents: read

concurrency:
  group: mobilizon-recurring-events
  cancel-in-progress: false

jobs:
  create-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.14
      - name: Create missing events
        run: uv run --locked --python 3.14 python recurring_events.py --config events.yaml
        env:
          MOBILIZON_GRAPHQL_URL: ${{ vars.MOBILIZON_GRAPHQL_URL }}
          MOBILIZON_MACHINE_USER_EMAIL: ${{ secrets.MOBILIZON_MACHINE_USER_EMAIL }}
          MOBILIZON_MACHINE_USER_PASSWORD: ${{ secrets.MOBILIZON_MACHINE_USER_PASSWORD }}
